schema_version = "1.0"

[[allow]]
glob = "scripts/**/*.py"
kind = "repo_tooling"
owner = "workspace-maintainers"
reason = "Repository maintenance and validation scripts are existing Python tooling that predate the Rust xtask migration."
surface = "tooling"
classification = "production"
covered_by = ["python scripts/validate_adr.py --verbose", "python scripts/generate_docs_index.py"]

[[allow]]
glob = "scripts/**/*.sh"
kind = "repo_tooling"
owner = "workspace-maintainers"
reason = "Shell wrappers provide cross-platform CI and release entry points while Rust replacements are staged."
surface = "tooling"
classification = "production"
covered_by = ["shellcheck scripts/*.sh scripts/pre-commit/*.sh"]

[[allow]]
glob = "scripts/**/*.ps1"
kind = "repo_tooling"
owner = "workspace-maintainers"
reason = "PowerShell wrappers support Windows CI and release workflows for this cross-platform project."
surface = "tooling"
classification = "production"
covered_by = ["pwsh -NoProfile -File scripts/lint_gates.ps1"]

[[allow]]
glob = ".github/workflows/*.yml"
kind = "ci_declarative"
owner = "release/ci"
reason = "GitHub Actions workflow definitions are platform-required YAML."
surface = "ci"
classification = "config"
covered_by = ["cargo xtask check-file-policy"]

[[allow]]
glob = "crates/**/tests/fixtures/**"
kind = "fixture_input"
owner = "test-fixtures"
reason = "Fixture directories intentionally carry non-Rust payloads consumed by Rust tests."
surface = "fixtures"
classification = "test"
covered_by = ["cargo test --all-features --workspace"]

[[allow]]
glob = "packaging/**/*"
kind = "packaging_config"
owner = "release/packaging"
reason = "Packaging metadata uses platform-specific declarative and scripting languages."
surface = "release"
classification = "config"
covered_by = ["cargo xtask check-file-policy"]

[[allow]]
path = "flake.nix"
kind = "dev_environment"
owner = "dev-infra"
reason = "Nix flake describes the reproducible development environment."
surface = "tooling"
classification = "config"
covered_by = ["nix flake check"]

[[allow]]
