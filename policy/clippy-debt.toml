# OpenRacing Clippy debt ledger.
#
# This file tracks lints that are intentionally `warn` instead of `deny`
# during the staged rollout, with an owner and a target promotion PR. It
# is the source of truth for "what is still warn-stage on purpose".
#
# A separate file from policy/clippy-lints.toml so the planned MSRV flips
# (which are time-based) don't get mixed up with the burndown ledger
# (which is debt-based).
#
# Validate with: python scripts/check_lint_policy.py

schema_version = "1.0"

# Stage A: items below are at `allow` in [workspace.lints], NOT `warn`.
# Existing CI runs `cargo clippy ... -- -D warnings`, which would
# promote a `warn` to an error and break unrelated builds. Each entry
# is promoted from `allow` -> `warn` (and then to `target_level`) by
# its named `target_pr` after the corresponding burndown lands.
# See docs/CLIPPY_POLICY.md "Stages" for the discipline.

