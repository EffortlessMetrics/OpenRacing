lint = "clippy::unwrap_used"
level = "allow"
target_level = "deny"
owner = "core"
target_pr = "policy/strict-clippy-flip"
target_date = "2026-09-01"
reason = "Stage A baseline; semantic checker enumerates findings before flip."

