schema_version = 1

[public]
packages = [
  "openracing",
  "openracing-engine",
  "openracing-ffb",
  "openracing-calibration",
  "openracing-curves",
  "openracing-profile",
  "openracing-hid",
  "openracing-pidff",
  "openracing-moza",
  "openracing-firmware-update",
  "openracing-plugin-abi",
  "openracing-plugin-sdk",
  "openracing-telemetry",
  "openracing-telemetry-adapters",
  "openracing-telemetry-config",
  "openracing-telemetry-recorder",
  "openracing-service",
  "wheelctl",
]

[internal]
packages = [
  "openracing-tools",
  "workspace-hack",
  "racing-wheel-ui",
  "racing-wheel-integration-tests",
  "compat",
  "openracing-test-helpers",
  "openracing-plugin-examples",
]

[transitional]
note = "Current package names are accepted until the naming-spine and collapse PRs land."
current_public_names = [
  { current = "racing-wheel-engine", target = "openracing-engine" },
  { current = "racing-wheel-service", target = "openracing-service" },
  { current = "racing-wheel-telemetry-core", target = "openracing-telemetry" },
  { current = "racing-wheel-telemetry-adapters", target = "openracing-telemetry-adapters" },
  { current = "racing-wheel-telemetry-config", target = "openracing-telemetry-config" },
  { current = "racing-wheel-telemetry-recorder", target = "openracing-telemetry-recorder" },
  { current = "openracing-pidff-common", target = "openracing-pidff" },
]

