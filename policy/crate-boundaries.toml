schema_version = 1

[public]
packages = [
  "openracing",
  "openracing-engine",
  "openracing-ffb",
  "openracing-calibration",
  "openracing-curves",
  "openracing-profile",
  "openracing-hid",
  "openracing-pidff",
  "openracing-moza",
  "openracing-firmware-update",
  "openracing-plugin-abi",
  "openracing-plugin-sdk",
  "openracing-telemetry",
  "openracing-telemetry-adapters",
  "openracing-telemetry-config",
  "openracing-telemetry-recorder",
  "openracing-service",
  "wheelctl",
]

[temporary_names]
# Current package names accepted until the naming-spine and collapse PRs land.
openracing-engine = "racing-wheel-engine"
openracing-pidff = "openracing-pidff-common"
openracing-service = "racing-wheel-service"
openracing-telemetry = "racing-wheel-telemetry-core"
openracing-telemetry-adapters = "racing-wheel-telemetry-adapters"
openracing-telemetry-config = "racing-wheel-telemetry-config"
openracing-telemetry-recorder = "racing-wheel-telemetry-recorder"

[internal]
packages = [
  "openracing-tools",
  "workspace-hack",
  "racing-wheel-ui",
  "racing-wheel-integration-tests",
  "compat",
  "openracing-test-helpers",
  "openracing-plugin-examples",
  "plugin-examples",
  "racing-wheel-schemas",
  "racing-wheel-changelog",
]

