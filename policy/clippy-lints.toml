schema = 1
msrv = "1.93"

[policy]
panic_free_tests = true
allow_test_carveouts = false
suppression_style = "expect-with-reason"
blanket_categories = false

# Panic-free production and tests
[[lint]]
name = "clippy::dbg_macro"
level = "deny"
status = "active"
class = "panic"
reason = "Debug macros are not acceptable in production or tests."

[[lint]]
name = "clippy::todo"
level = "deny"
status = "active"
class = "panic"
reason = "Todo placeholders must be tracked as issues or policy debt, not executable code."

[[lint]]
name = "clippy::unimplemented"
level = "deny"
status = "active"
class = "panic"
reason = "Unimplemented paths are panic paths and must not ship."

[[lint]]
name = "clippy::panic"
level = "deny"
status = "active"
class = "panic"
reason = "Workspace code, including tests, must not rely on panic-driven control flow."

[[lint]]
name = "clippy::unreachable"
level = "deny"
status = "active"
class = "panic"
reason = "Unreachable markers are panic paths and hide invalid state modeling."

[[lint]]
name = "clippy::unwrap_used"
level = "deny"
status = "active"
class = "panic"
reason = "No unchecked Result or Option collapse in production or tests."

[[lint]]
name = "clippy::expect_used"
level = "deny"
status = "active"
class = "panic"
reason = "Use typed errors or assertions that preserve context instead of expect panics."

[[lint]]
name = "clippy::get_unwrap"
level = "deny"
status = "active"
class = "panic"
reason = "Index-like get plus unwrap is still unchecked indexing."

[[lint]]
name = "clippy::unwrap_in_result"
level = "deny"
status = "active"
class = "panic"
reason = "Result-returning functions should propagate errors rather than panic internally."

[[lint]]
name = "clippy::panic_in_result_fn"
level = "deny"
status = "active"
class = "panic"
reason = "Result-returning functions must report failure via their result channel."

[[lint]]
name = "clippy::string_slice"
level = "deny"
status = "active"
class = "ast-safety"
reason = "String slicing can violate UTF-8 boundaries and panic."

[[lint]]
name = "clippy::indexing_slicing"
level = "deny"
status = "active"
class = "ast-safety"
reason = "Unchecked indexing and slicing are panic hazards in parser and real-time code."

[[lint]]
name = "clippy::out_of_bounds_indexing"
level = "deny"
status = "active"
class = "ast-safety"
reason = "Compile-time detectable out-of-bounds indexing must fail review."

[[lint]]
name = "clippy::unchecked_time_subtraction"
level = "deny"
status = "active"
class = "time"
reason = "Unchecked time subtraction can panic or produce invalid timing behavior."

# AST / parser / UTF-8 / slice safety
[[lint]]
name = "clippy::char_indices_as_byte_indices"
level = "deny"
status = "active"
class = "ast-safety"
reason = "Char indices must not be reused as byte offsets."

[[lint]]
name = "clippy::sliced_string_as_bytes"
level = "deny"
status = "active"
class = "ast-safety"
reason = "Slice bytes first when byte semantics are intended."

[[lint]]
name = "clippy::index_refutable_slice"
level = "deny"
status = "active"
class = "ast-safety"
reason = "Refutable slice destructuring should be explicit and bounded."

# Silent failure
[[lint]]
name = "clippy::let_underscore_future"
level = "deny"
status = "active"
class = "silent-failure"
reason = "Futures must be awaited, spawned, or explicitly dropped with a receipt."

[[lint]]
name = "clippy::let_underscore_must_use"
level = "deny"
status = "active"
class = "silent-failure"
reason = "Must-use values cannot be silently discarded."

[[lint]]
name = "clippy::let_underscore_lock"
level = "deny"
status = "active"
class = "silent-failure"
reason = "Lock lifetimes must be visible in code."

[[lint]]
name = "clippy::unused_result_ok"
level = "deny"
status = "active"
class = "silent-failure"
reason = "Discarded Result::ok calls hide failures."

[[lint]]
name = "clippy::map_err_ignore"
level = "deny"
status = "active"
class = "silent-failure"
reason = "Error mapping must preserve useful failure context."

[[lint]]
name = "clippy::assertions_on_result_states"
level = "deny"
status = "active"
class = "silent-failure"
reason = "Result assertions should expose error values instead of hiding them."

[[lint]]
name = "clippy::lines_filter_map_ok"
level = "deny"
status = "active"
class = "silent-failure"
reason = "I/O line processing must not hide repeated read errors."

# Async / concurrency
[[lint]]
name = "clippy::await_holding_lock"
level = "deny"
status = "active"
class = "concurrency"
reason = "Do not hold locks across await points."

[[lint]]
name = "clippy::await_holding_refcell_ref"
level = "deny"
status = "active"
class = "concurrency"
reason = "Do not hold RefCell borrows across await points."

[[lint]]
name = "clippy::await_holding_invalid_type"
level = "deny"
status = "active"
class = "concurrency"
reason = "Configured invalid await-held types must remain out of async suspension points."

[[lint]]
name = "clippy::future_not_send"
level = "warn"
status = "active"
class = "concurrency"
reason = "Non-Send futures need review before crossing runtime boundaries."

[[lint]]
name = "clippy::large_futures"
level = "warn"
status = "active"
class = "concurrency"
reason = "Large futures can hide allocation and scheduling costs."

[[lint]]
name = "clippy::arc_with_non_send_sync"
level = "deny"
status = "active"
class = "concurrency"
reason = "Arc over non-Send/Sync data suggests incorrect shared ownership."

[[lint]]
name = "clippy::rc_mutex"
level = "deny"
status = "active"
class = "concurrency"
reason = "Rc<Mutex<_>> is a single-threaded ownership smell."

[[lint]]
name = "clippy::mut_mutex_lock"
level = "deny"
status = "active"
class = "concurrency"
reason = "Mutable access should avoid unnecessary mutex locking."

[[lint]]
name = "clippy::readonly_write_lock"
level = "deny"
status = "active"
class = "concurrency"
reason = "Read-only work should not acquire write locks."

# Unsafe / memory
[[lint]]
name = "clippy::mem_forget"
level = "deny"
status = "active"
class = "unsafe-memory"
reason = "Forgetting values bypasses destructors and must be modeled explicitly."

[[lint]]
name = "clippy::forget_non_drop"
level = "deny"
status = "active"
class = "unsafe-memory"
reason = "Forgetting non-Drop values is usually meaningless or misleading."

[[lint]]
name = "clippy::drop_non_drop"
level = "deny"
status = "active"
class = "unsafe-memory"
reason = "Dropping non-Drop values usually only manipulates lifetimes indirectly."

[[lint]]
name = "clippy::undocumented_unsafe_blocks"
level = "deny"
status = "active"
class = "unsafe-memory"
reason = "Unsafe blocks require a local safety argument."

[[lint]]
name = "clippy::multiple_unsafe_ops_per_block"
level = "deny"
status = "active"
class = "unsafe-memory"
reason = "Keep unsafe operations small enough to review."

[[lint]]
name = "clippy::repr_packed_without_abi"
level = "deny"
status = "active"
class = "unsafe-memory"
reason = "Packed representations need explicit ABI intent."

# Numeric correctness
[[lint]]
name = "clippy::float_cmp"
level = "deny"
status = "active"
class = "numeric"
reason = "Floating comparisons need domain tolerances."

[[lint]]
name = "clippy::float_cmp_const"
level = "deny"
status = "active"
class = "numeric"
reason = "Floating comparisons to constants need explicit tolerances."

[[lint]]
name = "clippy::float_equality_without_abs"
level = "deny"
status = "active"
class = "numeric"
reason = "Floating equality checks should use absolute tolerances."

[[lint]]
name = "clippy::lossy_float_literal"
level = "deny"
status = "active"
class = "numeric"
reason = "Lossy float literals should be reviewed explicitly."

[[lint]]
name = "clippy::cast_sign_loss"
level = "deny"
status = "active"
class = "numeric"
reason = "Sign-losing casts are high-risk in device and telemetry boundaries."

[[lint]]
name = "clippy::cast_possible_wrap"
level = "warn"
status = "active"
class = "numeric"
reason = "Wrapping casts need review before promotion to deny."

[[lint]]
name = "clippy::cast_possible_truncation"
level = "warn"
status = "active"
class = "numeric"
reason = "Truncating casts need review before promotion to deny."

[[lint]]
name = "clippy::cast_precision_loss"
level = "warn"
status = "active"
class = "numeric"
reason = "Precision-losing casts need review before promotion to deny."

[[lint]]
name = "clippy::invalid_upcast_comparisons"
level = "deny"
status = "active"
class = "numeric"
reason = "Invalid upcast comparisons indicate unreachable or incorrect numeric checks."

[[lint]]
name = "clippy::cast_abs_to_unsigned"
level = "deny"
status = "active"
class = "numeric"
reason = "Use unsigned_abs to make signed absolute-value conversion explicit."

[[lint]]
name = "clippy::cast_enum_truncation"
level = "deny"
status = "active"
class = "numeric"
reason = "Enum truncation casts can corrupt protocol values."

[[lint]]
name = "clippy::cast_nan_to_int"
level = "deny"
status = "active"
class = "numeric"
reason = "NaN-to-integer casts need explicit handling."

[[lint]]
name = "clippy::manual_midpoint"
level = "warn"
status = "active"
class = "numeric"
reason = "Prefer standard midpoint helpers where available."

[[lint]]
name = "clippy::manual_is_multiple_of"
level = "warn"
status = "active"
class = "numeric"
reason = "Prefer standard divisibility helpers."

[[lint]]
name = "clippy::manual_div_ceil"
level = "warn"
status = "active"
class = "numeric"
reason = "Prefer standard ceiling division helpers."

[[lint]]
name = "clippy::arithmetic_side_effects"
level = "warn"
status = "active"
class = "numeric"
reason = "OpenRacing has broad numeric and real-time code; arithmetic policy starts as warn while debt is triaged."

# File/process/path footguns
[[lint]]
name = "clippy::suspicious_open_options"
level = "deny"
status = "active"
class = "file-policy"
reason = "File creation/truncation behavior must be explicit."

[[lint]]
name = "clippy::nonsensical_open_options"
level = "deny"
status = "active"
class = "file-policy"
reason = "Nonsensical file open modes indicate dead or wrong I/O behavior."

[[lint]]
name = "clippy::ineffective_open_options"
level = "deny"
status = "active"
class = "file-policy"
reason = "Ineffective file open options hide policy intent."

[[lint]]
name = "clippy::path_buf_push_overwrite"
level = "deny"
status = "active"
class = "file-policy"
reason = "Path pushes must not accidentally discard prior path components."

[[lint]]
name = "clippy::join_absolute_paths"
level = "deny"
status = "active"
class = "file-policy"
reason = "Joining absolute paths can bypass intended roots."

[[lint]]
name = "clippy::read_line_without_trim"
level = "warn"
status = "active"
class = "file-policy"
reason = "Line-oriented input should make delimiter handling explicit."

[[lint]]
name = "clippy::exit"
level = "deny"
status = "active"
class = "process-policy"
reason = "Process exit is only acceptable at explicitly reviewed CLI boundaries."

# API / trait correctness
[[lint]]
name = "clippy::iter_not_returning_iterator"
level = "deny"
status = "active"
class = "api"
reason = "Iterator-named APIs should return iterators."

[[lint]]
name = "clippy::expl_impl_clone_on_copy"
level = "deny"
status = "active"
class = "api"
reason = "Copy types should not carry bespoke Clone behavior."

[[lint]]
name = "clippy::infallible_try_from"
level = "deny"
status = "active"
class = "api"
reason = "Infallible conversions should use From."

[[lint]]
name = "clippy::fallible_impl_from"
level = "deny"
status = "active"
class = "api"
reason = "Fallible conversions must use TryFrom."

[[lint]]
name = "clippy::error_impl_error"
level = "deny"
status = "active"
class = "api"
reason = "Error-like types should implement the standard Error trait correctly."

[[lint]]
name = "clippy::result_unit_err"
level = "warn"
status = "active"
class = "api"
reason = "Unit errors lose context and should be migrated intentionally."

[[lint]]
name = "clippy::result_large_err"
level = "warn"
status = "active"
class = "api"
reason = "Large errors can increase Result movement costs."

# Good taste that pays rent
[[lint]]
name = "clippy::format_in_format_args"
level = "deny"
status = "active"
class = "reviewability"
reason = "Avoid nested formatting allocations and obscured format strings."

[[lint]]
name = "clippy::to_string_in_format_args"
level = "deny"
status = "active"
class = "reviewability"
reason = "Formatting should avoid unnecessary String allocation."

[[lint]]
name = "clippy::unused_format_specs"
level = "deny"
status = "active"
class = "reviewability"
reason = "Format specs that do not apply are misleading."

[[lint]]
name = "clippy::unnecessary_debug_formatting"
level = "warn"
status = "active"
class = "reviewability"
reason = "Prefer display formatting when debug output is not intended."

[[lint]]
name = "clippy::uninlined_format_args"
level = "warn"
status = "active"
class = "reviewability"
reason = "Inline format args improve readability."

[[lint]]
name = "clippy::manual_let_else"
level = "warn"
status = "active"
class = "reviewability"
reason = "let-else expresses early-return shape clearly."

[[lint]]
name = "clippy::manual_ok_or"
level = "warn"
status = "active"
class = "reviewability"
reason = "Use standard Option-to-Result helpers."

[[lint]]
name = "clippy::manual_strip"
level = "warn"
status = "active"
class = "reviewability"
reason = "Use strip_prefix/strip_suffix to avoid offset mistakes."

[[lint]]
name = "clippy::manual_split_once"
level = "warn"
status = "active"
class = "reviewability"
reason = "Use split_once when only one split is needed."

[[lint]]
name = "clippy::manual_is_variant_and"
level = "warn"
status = "active"
class = "reviewability"
reason = "Use is_some_and/is_ok_and/is_err_and-style helpers when clearer."

[[lint]]
name = "clippy::filter_map_next"
level = "warn"
status = "active"
class = "reviewability"
reason = "Use find_map to encode intent directly."

[[lint]]
name = "clippy::flat_map_option"
level = "warn"
status = "active"
class = "reviewability"
reason = "Prefer filter_map for Option-producing iterator steps."

[[lint]]
name = "clippy::match_result_ok"
level = "deny"
status = "active"
class = "reviewability"
reason = "Match Result directly instead of discarding the Err branch via ok()."

[[lint]]
name = "clippy::cloned_instead_of_copied"
level = "warn"
status = "active"
class = "reviewability"
reason = "Use copied for Copy types."

[[lint]]
name = "clippy::iter_cloned_collect"
level = "warn"
status = "active"
class = "reviewability"
reason = "Use to_vec or collect intent more directly."

[[lint]]
name = "clippy::iter_overeager_cloned"
level = "warn"
status = "active"
class = "reviewability"
reason = "Clone after filtering when possible."

[[lint]]
name = "clippy::needless_collect"
level = "warn"
status = "active"
class = "reviewability"
reason = "Avoid temporary collections unless they encode a boundary."

[[lint]]
name = "clippy::redundant_closure"
level = "warn"
status = "active"
class = "reviewability"
reason = "Use function items directly when possible."

[[lint]]
name = "clippy::redundant_closure_for_method_calls"
level = "warn"
status = "active"
class = "reviewability"
reason = "Use method references when they are clearer."

[[lint]]
name = "clippy::missing_panics_doc"
level = "deny"
status = "active"
class = "api"
reason = "Public panic behavior must be documented or removed."

[[lint]]
name = "clippy::missing_errors_doc"
level = "warn"
status = "active"
class = "api"
reason = "Public error behavior should be documented."

# Suppression governance
[[lint]]
name = "clippy::allow_attributes"
level = "deny"
status = "active"
class = "suppression"
reason = "Use expect with a reason instead of silent allow attributes."

[[lint]]
name = "clippy::allow_attributes_without_reason"
level = "deny"
status = "active"
class = "suppression"
reason = "Every suppression needs a reviewable reason."

[[lint]]
name = "clippy::blanket_clippy_restriction_lints"
level = "deny"
status = "active"
class = "suppression"
reason = "Do not enable broad restriction categories without explicit lint selection."

[[lint]]
name = "clippy::ignore_without_reason"
level = "deny"
status = "active"
class = "suppression"
reason = "Ignored tests must explain why they are not running."

[[lint]]
name = "clippy::should_panic_without_expect"
level = "deny"
status = "active"
class = "suppression"
reason = "Panic-expected tests must document the expected panic shape."

[[planned]]
name = "clippy::same_length_and_capacity"
level = "deny"
activate_when_msrv = "1.94"
reason = "Catch raw-parts reconstruction mistakes."

[[planned]]
name = "clippy::manual_ilog2"
level = "warn"
activate_when_msrv = "1.94"
reason = "Prefer the standard integer log helper."

[[planned]]
name = "clippy::decimal_bitwise_operands"
level = "warn"
activate_when_msrv = "1.94"
reason = "Make bit masks visually inspectable."

[[planned]]
name = "clippy::needless_type_cast"
level = "warn"
activate_when_msrv = "1.94"
reason = "Avoid stale numeric type drift."

[[planned]]
name = "clippy::disallowed_fields"
level = "deny"
activate_when_msrv = "1.95"
reason = "Allow architecture policy to ban direct field access across protected seams."

[[planned]]
name = "clippy::manual_checked_ops"
level = "warn"
activate_when_msrv = "1.95"
reason = "Prefer checked arithmetic over manual divide-by-zero guards."

[[planned]]
name = "clippy::manual_take"
level = "warn"
activate_when_msrv = "1.95"
reason = "Use standard ownership helper instead of local reimplementation."

[[planned]]
name = "clippy::manual_pop_if"
level = "warn"
activate_when_msrv = "1.95"
reason = "Use collection APIs that encode predicate-and-pop intent directly."

[[planned]]
name = "clippy::duration_suboptimal_units"
level = "warn"
activate_when_msrv = "1.95"
reason = "Make durations legible without mental unit conversion."

[[planned]]
name = "clippy::unnecessary_trailing_comma"
level = "warn"
activate_when_msrv = "1.95"
reason = "Keep generated and hand-written format macro calls clean."
